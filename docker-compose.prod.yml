# Production Docker Compose for Dokploy / Remote deployment with Traefik
# Fully self-contained: Uses pre-built images from Docker Hub with zero host file dependencies.

services:
  # --- Supabase: Postgres
  db:
    image: supabase/postgres:17.6.1.136
    ports:
      - "127.0.0.1:${DB_PORT:-54322}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      JWT_EXP: ${JWT_EXP:-3600}
    volumes:
      - db_data:/var/lib/postgresql/data
    entrypoint:
      - "bash"
      - "-c"
      - |
        cat << 'EOF' > /docker-entrypoint-initdb.d/zz-roles.sql
        ALTER ROLE supabase_auth_admin WITH LOGIN PASSWORD '${POSTGRES_PASSWORD:-postgres}';
        ALTER ROLE authenticator WITH LOGIN PASSWORD '${POSTGRES_PASSWORD:-postgres}';
        EOF
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- Supabase: Auth (GoTrue)
  auth:
    image: supabase/gotrue:v2.189.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: ${FRONTEND_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: "${JWT_EXP:-3600}"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: "${SMTP_PORT:-1025}"
      GOTRUE_SMTP_USER: "${SMTP_USER:-}"
      GOTRUE_SMTP_PASS: "${SMTP_PASS:-}"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@lexhub.local}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-LexHub}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # --- Supabase: PostgREST
  rest:
    image: postgrest/postgrest:v14.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    restart: unless-stopped

  # --- Supabase: Gateway
  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-54321}:8000"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        cat << 'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 8000;
            server_name _;
            client_max_body_size 50m;
            resolver 127.0.0.11 ipv6=off valid=10s;

            location /auth/v1/ {
                if ($$request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin $$http_origin always;
                    add_header Access-Control-Allow-Credentials true always;
                    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                    add_header Access-Control-Allow-Headers $$http_access_control_request_headers always;
                    add_header Access-Control-Max-Age 86400 always;
                    add_header Content-Length 0;
                    return 204;
                }
                proxy_hide_header Access-Control-Allow-Origin;
                add_header Access-Control-Allow-Origin $$http_origin always;
                add_header Access-Control-Allow-Credentials true always;

                set $$auth_upstream auth:9999;
                rewrite ^/auth/v1/(.*)$$ /$$1 break;
                proxy_pass http://$$auth_upstream;
            }

            location /rest/v1/ {
                if ($$request_method = OPTIONS) {
                    add_header Access-Control-Allow-Origin $$http_origin always;
                    add_header Access-Control-Allow-Credentials true always;
                    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                    add_header Access-Control-Allow-Headers $$http_access_control_request_headers always;
                    add_header Access-Control-Max-Age 86400 always;
                    add_header Content-Length 0;
                    return 204;
                }
                proxy_hide_header Access-Control-Allow-Origin;
                add_header Access-Control-Allow-Origin $$http_origin always;
                add_header Access-Control-Allow-Credentials true always;

                set $$rest_upstream rest:3000;
                rewrite ^/rest/v1/(.*)$$ /$$1 break;
                proxy_pass http://$$rest_upstream;
            }
        }
        EOF
        nginx -g 'daemon off;'
    depends_on:
      - auth
      - rest
    restart: unless-stopped

  # --- Helper: Extract schema from pre-built backend image into a named volume
  schema-loader:
    image: ${DOCKER_IMAGE_REPO:-fadelmamar/lex-hub}:backend-${TAG:-latest}
    volumes:
      - schema_data:/schema-dir
    command: cp /app/schema.sql /schema-dir/schema.sql
    restart: "no"

  # --- One-shot: load schema.sql
  db-init:
    image: supabase/postgres:17.6.1.136
    depends_on:
      schema-loader:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      DB: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
    volumes:
      - schema_data:/schema-dir:ro
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        until psql "$$DB" -tAc "select to_regclass('auth.users')" | grep -q auth; do
          echo "waiting for auth schema..."; sleep 2;
        done
        if psql "$$DB" -tAc "select to_regclass('public.user_profiles')" | grep -q user_profiles; then
          echo "schema already applied, skipping";
        else
          psql "$$DB" -v ON_ERROR_STOP=1 -f /schema-dir/schema.sql;
        fi
        psql "$$DB" -c "grant usage on schema public to service_role;
          grant all privileges on all tables in schema public to service_role;
          grant all privileges on all sequences in schema public to service_role;"
    restart: "no"

  # --- Local SMTP catcher (or external SMTP in production)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  # --- Storage (RustFS / S3 compatible)
  storage:
    image: rustfs/rustfs:latest
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - storage_data:/data
    restart: unless-stopped

  createbucket:
    image: amazon/aws-cli
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "until aws --endpoint-url http://storage:9000 s3 ls; do echo 'waiting for storage'; sleep 2; done;
          aws --endpoint-url http://storage:9000 s3 mb s3://${R2_BUCKET_NAME:-mike} || true"
    restart: "no"

  # --- Backend Service (Pre-built Image)
  backend:
    image: ${DOCKER_IMAGE_REPO:-fadelmamar/lex-hub}:backend-${TAG:-latest}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL}
      - SUPABASE_URL=http://gateway:8000
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-http://storage:9000}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-rustfsadmin}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-rustfsadmin}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-mike}
      - USER_API_KEYS_ENCRYPTION_SECRET=${USER_API_KEYS_ENCRYPTION_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://api.tensorx.ai/v1}
      - OLLAMA_API_KEY=${TENSORX_API_KEY}
      - OTEL_TRACING_ENABLED=${OTEL_TRACING_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://mlflow:5000}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-lex-hub-backend}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-x-mlflow-experiment-id=0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-init:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
      auth:
        condition: service_started
      rest:
        condition: service_started
      mlflow:
        condition: service_started
    restart: unless-stopped

  # --- MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.0
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    restart: unless-stopped

  # --- Frontend Service (Pre-built Image)
  frontend:
    image: ${DOCKER_IMAGE_REPO:-fadelmamar/lex-hub}:frontend-${TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
  mlflow_data:
  schema_data:
